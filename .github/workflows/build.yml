name: Build BlazeMind (Windows, Mac, Linux)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The in-game AI mod (BlazeMind Bridge), built for each Minecraft version
  bridge:
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '1.21.4', '1.21', '1.20.1', '1.20.4', '1.21.3']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Find Fabric versions for Minecraft ${{ matrix.mc }}
        id: v
        run: |
          MC='${{ matrix.mc }}'
          echo "yarn=$(curl -fsSL https://meta.fabricmc.net/v2/versions/yarn/$MC | jq -r '.[0].version')" >> $GITHUB_OUTPUT
          echo "loader=$(curl -fsSL https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version')" >> $GITHUB_OUTPUT
          echo "api=$(curl -fsSL "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')" >> $GITHUB_OUTPUT
          case "$MC" in 1.20*) echo "java=17" >> $GITHUB_OUTPUT ;; *) echo "java=21" >> $GITHUB_OUTPUT ;; esac
      - name: Build
        working-directory: bridge-mod
        run: gradle build --no-daemon -Pminecraft_version='${{ matrix.mc }}' -Pyarn_mappings='${{ steps.v.outputs.yarn }}' -Ploader_version='${{ steps.v.outputs.loader }}' -Pfabric_version='${{ steps.v.outputs.api }}' -Pjava_release='${{ steps.v.outputs.java }}'
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.mc }}
          path: bridge-mod/build/libs/blazemind-bridge-${{ matrix.mc }}-1.0.0.jar
          if-no-files-found: error

  build:
    needs: bridge
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: bridge-*
          path: bridge-dl
          merge-multiple: true
      - name: Put the in-game AI mods in the app
        shell: bash
        run: |
          mkdir -p bridge
          for f in bridge-dl/*.jar; do [ -e "$f" ] || continue; n=$(basename "$f" | sed -E 's/-1\.0\.0\.jar$/.jar/'); cp "$f" "bridge/$n"; done
          ls bridge
      - run: npm install
      # Every build gets a new version (1.0.<build number>) so launchers can spot the update
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: blazemind-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=1.0.${{ github.run_number }}
          git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.txt
          cat >> notes.txt <<'NOTES'

          ---
          **Download:**
          - **Windows:** BlazeMind-Setup.exe (installer) or BlazeMind-Portable.exe (no install)
          - **Mac** (Intel + Apple Silicon): BlazeMind-Mac.dmg. The first time, right-click the app, then choose Open.
          - **Linux:** BlazeMind-Linux.AppImage (any distro: make it executable, then run it) or BlazeMind-Linux.deb (Ubuntu/Debian)
          NOTES
          gh release delete latest --yes --cleanup-tag || true
          # If this version already exists (a re-run), just add or replace the files
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" out/* --clobber
          else
            gh release create "v$VERSION" out/* --title "BlazeMind v$VERSION" --notes-file notes.txt --latest
          fi
